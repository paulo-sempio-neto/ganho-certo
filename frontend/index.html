<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>GanhoCerto</title>
    <!-- Dark from the first paint: no white flash before the CSS loads, and dark browser chrome on phones. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#030303" />
    <style>html { background: #030303; }</style>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- Self-hosted Satoshi (see src/styles/fonts.css); preload the two weights the first screen needs. -->
    <link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/satoshi-500.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
